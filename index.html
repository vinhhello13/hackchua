<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POGO GAMING - Shop Game & Script VIP (Liquid Glass UI)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eef2ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' },
                        cyber: { dark: '#080c14', card: '#151c2e', border: '#232d45', neon: '#10b981', accent: '#f43f5e', cyan: '#06b6d4' }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
                        mono: ['Fira Code', 'JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        html { transition: background-color 0.3s ease, color 0.3s ease; scroll-behavior: smooth; }
        html.dark body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #060911;
            color: #f3f4f6;
            background-image: 
                radial-gradient(at 50% 10%, rgba(99, 102, 241, 0.18) 0px, transparent 60%),
                radial-gradient(at 80% 80%, rgba(244, 63, 94, 0.12) 0px, transparent 50%),
                radial-gradient(at 10% 50%, rgba(6, 182, 212, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
        }
        html.dark .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.09);
        }
        html.dark .glass-card {
            background: rgba(18, 26, 47, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card:hover {
            transform: translateY(-6px);
            border-color: rgba(99, 102, 241, 0.45);
            box-shadow: 0 20px 40px -12px rgba(99, 102, 241, 0.3);
        }
        .liquid-btn {
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            user-select: none;
        }
        .liquid-btn-primary {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.9), rgba(79, 70, 229, 0.85));
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #ffffff !important;
            box-shadow: 0 8px 25px -5px rgba(99, 102, 241, 0.45);
        }
        .liquid-btn-cyan {
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.85), rgba(14, 116, 144, 0.75));
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #ffffff !important;
            box-shadow: 0 8px 25px -5px rgba(6, 182, 212, 0.4);
        }
        html.dark .liquid-btn-secondary {
            background: rgba(30, 41, 59, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #cbd5e1;
        }
        .liquid-btn-active {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.95), rgba(67, 56, 202, 0.9)) !important;
            color: #ffffff !important;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .post-preview-box img {
            width: 100% !important;
            max-width: 100% !important;
            height: 190px !important;
            object-fit: cover !important;
            margin: 0 auto !important;
            display: block !important;
            border-radius: 12px;
            border: 2px solid rgb(46, 213, 115);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-indigo-500 selection:text-white">

    <!-- HEADER -->
    <header class="glass-panel sticky top-0 z-40 border-b border-slate-800/80">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">
            <a href="#" class="flex items-center gap-3 group">
                <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-indigo-600 via-purple-600 to-rose-500 flex items-center justify-center font-black text-2xl text-white shadow-lg shadow-indigo-500/30 group-hover:scale-105 transition duration-300">
                    P
                </div>
                <div class="flex flex-col">
                    <span class="text-2xl font-extrabold tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-indigo-500 via-purple-500 to-rose-500">
                        POGO<span class="text-indigo-500">GAMING</span>
                    </span>
                    <span class="text-[10px] tracking-widest text-slate-400 font-semibold uppercase -mt-1">Liquid Script & Game Store</span>
                </div>
            </a>

            <div class="flex items-center gap-3">
                <div class="hidden sm:flex items-center gap-2 bg-slate-900/80 border border-emerald-500/30 rounded-full px-4 py-2 shadow-inner backdrop-blur-md">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span class="text-xs text-slate-400 font-semibold">Ví:</span>
                    <span class="text-sm font-extrabold text-emerald-400 tracking-wide" id="globalUserBalance">0đ</span>
                </div>

                <button onclick="openUserModal()" class="liquid-btn liquid-btn-secondary flex items-center gap-2.5 rounded-full px-4 py-2 transition group">
                    <div class="w-7 h-7 rounded-full bg-indigo-600/30 border border-indigo-400/40 flex items-center justify-center text-indigo-300 text-xs font-bold">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <span class="text-sm font-bold text-slate-200 group-hover:text-white transition" id="globalUserName">Khách</span>
                    <i class="fa-solid fa-chevron-down text-[10px] text-slate-400"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- NAVIGATION BAR -->
    <div class="max-w-5xl mx-auto w-full px-4 sm:px-6 lg:px-8 mt-6">
        <div class="glass-panel rounded-2xl p-2.5 flex items-center justify-between gap-3 shadow-2xl border border-slate-800">
            <nav class="flex items-center gap-1.5 sm:gap-2.5 overflow-x-auto hide-scrollbar">
                <a href="#" class="liquid-btn liquid-btn-active flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-bold shrink-0">
                    <i class="fa-solid fa-house text-indigo-200"></i> Trang chủ
                </a>
                <a href="#giftcode" onclick="openGiftcodeModal()" class="liquid-btn liquid-btn-secondary flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-bold shrink-0">
                    <i class="fa-solid fa-gift text-rose-400"></i> Giftcode
                </a>
                <a href="#lichsu" onclick="openHistoryModal()" class="liquid-btn liquid-btn-secondary flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-bold shrink-0">
                    <i class="fa-solid fa-clock-rotate-left text-amber-400"></i> Lịch sử
                </a>
            </nav>

            <div class="relative w-40 sm:w-60">
                <input type="text" id="searchInput" onkeyup="filterCards()" placeholder="Tìm kiếm script..." class="w-full bg-slate-900/90 border border-slate-700/80 focus:border-indigo-500 rounded-xl px-3.5 py-2 pl-9 text-xs font-semibold text-slate-200 placeholder-slate-500 outline-none transition backdrop-blur-md">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-xs text-slate-500"></i>
            </div>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <main class="max-w-5xl mx-auto w-full px-4 sm:px-6 lg:px-8 my-10 flex-1">
        <div class="flex items-center justify-between mb-6">
            <div class="flex items-center gap-3">
                <div class="w-2.5 h-6 bg-gradient-to-b from-indigo-500 via-purple-500 to-rose-500 rounded-full"></div>
                <h2 class="text-xl font-extrabold text-white tracking-wide">DANH SÁCH SẢN PHẨM SCRIPT VIP</h2>
            </div>
            <span class="text-xs font-semibold text-slate-400 bg-slate-900/80 border border-slate-800 px-3 py-1.5 rounded-xl backdrop-blur-md">Hệ thống Real-time CMS</span>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-stretch" id="cardContainer">
            <div class="glass-card rounded-2xl p-6 text-center text-slate-400 text-xs col-span-2 py-12">
                <i class="fa-solid fa-spinner fa-spin text-2xl mb-2 text-indigo-400"></i>
                <p>Đang tải danh sách script từ hệ thống quản trị...</p>
            </div>
        </div>
    </main>

    <!-- GENERAL MODAL -->
    <div id="generalModal" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
        <div id="modalBox" class="glass-panel rounded-2xl max-w-2xl w-full p-6 border border-slate-700 shadow-2xl relative modal-content-box max-h-[90vh] overflow-y-auto hide-scrollbar">
            <button onclick="closeModal()" class="liquid-btn liquid-btn-secondary absolute top-4 right-4 text-slate-400 hover:text-white transition w-8 h-8 rounded-full flex items-center justify-center z-10">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <h3 id="modalTitle" class="text-lg font-extrabold text-white mb-4 tracking-wide">Thông Báo</h3>
            <div id="modalBody" class="text-xs text-slate-300 leading-relaxed"></div>
            <button onclick="closeModal()" class="liquid-btn liquid-btn-secondary w-full mt-6 text-white font-bold py-2.5 rounded-xl text-xs">
                Đóng cửa sổ
            </button>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC TRANG CHỦ -->
    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz_YC2ALIH4fux4jTPOiZFRcf-c2oP6cCNNtazPlEdiNPE-P0cMQ7t8LJevKEHVTnB6/exec";
        let CURRENT_ACTIVE_POST_ID = "";

        // 🟢 HÀM BẤM ẨN/HIỆN FORM BÁO LỖI (BẢO ĐẢM CHẠY 100%)
        function toggleBaoLoi() {
            const box = document.getElementById("formBaoLoiBox");
            if (box) {
                if (box.style.display === "none" || box.style.display === "") {
                    box.style.display = "block";
                } else {
                    box.style.display = "none";
                }
            }
        }

        // 🔴 HÀM GỬI BÁO LỖI VÀ KHÓA BÀI VIẾT TỪ GIAO DIỆN
        async function guiBaoLoi() {
            const loggedUser = localStorage.getItem("logged_user") || "Chưa đăng nhập";
            const tieuDeEl = document.getElementById("loiTieuDe");
            const noiDungEl = document.getElementById("loiNoiDung");
            
            const tieuDe = tieuDeEl ? tieuDeEl.value : "Báo lỗi chung";
            const noiDungChiTiet = noiDungEl ? noiDungEl.value.trim() : "";
            const fullMessage = "[" + tieuDe + "] [ID: " + CURRENT_ACTIVE_POST_ID + "]" + (noiDungChiTiet ? " " + noiDungChiTiet : "");

            // Khóa giao diện ngay tại chỗ
            const tag = document.getElementById("statusTag");
            if (tag) {
                tag.innerText = "🔴 BẢO TRÌ / ĐANG CẬP NHẬT";
                tag.style.color = "#fb7185";
            }

            const freeBox = document.getElementById("khoangFreeBox");
            const vipBox = document.getElementById("khoangVipBox");
            if (freeBox) freeBox.style.display = "none";
            if (vipBox) vipBox.style.display = "none";

            try {
                await fetch(SCRIPT_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ 
                        action: "reportAndLock", 
                        postId: CURRENT_ACTIVE_POST_ID, 
                        username: loggedUser, 
                        message: fullMessage 
                    })
                });
                alert("✅ Đã gửi báo lỗi! Trạng thái bài viết đã được tự động chuyển sang BẢO TRÌ.");
            } catch (err) {
                alert("✅ Đã gửi báo lỗi ngầm tới hệ thống!");
            }

            if (noiDungEl) noiDungEl.value = "";
            const box = document.getElementById("formBaoLoiBox");
            if (box) box.style.display = "none";
        }

        function generatePostId(fileName) {
            let hash = 0;
            for (let i = 0; i < fileName.length; i++) {
                hash = ((hash << 5) - hash) + fileName.charCodeAt(i);
                hash |= 0;
            }
            return "ID_" + Math.abs(hash).toString(36).toUpperCase();
        }

        async function loadPosts() {
            try {
                const res = await fetch('https://api.github.com/repos/vinhhello13/hackchua/contents/_posts');
                const files = await res.json();
                
                const container = document.getElementById('cardContainer');
                if (!container) return;
                container.innerHTML = '';

                if (!Array.isArray(files) || files.length === 0) {
                    container.innerHTML = '<div class="glass-card rounded-2xl p-6 text-center text-slate-400 text-xs col-span-2 py-8">Chưa có bài viết nào!</div>';
                    return;
                }

                for (const file of files) {
                    if (file.name.endsWith('.md')) {
                        const contentRes = await fetch(file.download_url);
                        const rawText = await contentRes.text();
                        
                        const parts = rawText.split('---');
                        let title = file.name.replace('.md', '');
                        let externalHTML = '';
                        let internalHTML = '';

                        if (parts.length >= 3) {
                            const yamlHeader = parts[1];
                            const fullBody = parts.slice(2).join('---').trim();

                            const titleMatch = yamlHeader.match(/title:\s*"?(.*?)"?$/m);
                            if (titleMatch && titleMatch[1]) title = titleMatch[1];

                            if (fullBody.includes('<!--more-->')) {
                                const splitParts = fullBody.split('<!--more-->');
                                externalHTML = splitParts[0].trim();
                                internalHTML = splitParts[1].trim();
                            } else {
                                externalHTML = fullBody;
                                internalHTML = fullBody;
                            }
                        }

                        const uniquePostId = generatePostId(file.name);

                        const postCard = document.createElement('div');
                        postCard.className = 'glass-card rounded-2xl p-6 flex flex-col justify-between relative overflow-hidden group card-item border border-slate-800 cursor-pointer';
                        
                        postCard.innerHTML = `
                            <div class="flex items-center justify-between mb-4 pointer-events-none">
                                <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 backdrop-blur-md">
                                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span> WORKING 100%
                                </span>
                            </div>
                            <div class="post-preview-box flex flex-col items-center justify-center space-y-3 mb-6 text-center w-full pointer-events-none">
                                ${externalHTML}
                            </div>
                            <div class="pt-2 pointer-events-none">
                                <button class="btn-xem liquid-btn liquid-btn-cyan w-full font-extrabold py-3.5 rounded-xl text-xs uppercase tracking-wider flex items-center justify-center gap-2">
                                    <i class="fa-solid fa-eye text-cyan-200"></i> XEM SCRIPT CHI TIẾT
                                </button>
                            </div>
                        `;

                        const openDetailAction = () => {
                            CURRENT_ACTIVE_POST_ID = uniquePostId;
                            openModal(title, `<div class="w-full text-slate-200 overflow-x-auto">${internalHTML}</div>`);
                            
                            setTimeout(() => {
                                const modalBody = document.getElementById('modalBody');
                                if (modalBody) {
                                    const idSpan = modalBody.querySelector('#displayPostId');
                                    if (idSpan) idSpan.innerText = uniquePostId;

                                    const scripts = modalBody.querySelectorAll('script');
                                    scripts.forEach(oldScript => {
                                        const newScript = document.createElement('script');
                                        newScript.text = `const MY_POST_ID = "${uniquePostId}";\n` + oldScript.text;
                                        oldScript.parentNode.replaceChild(newScript, oldScript);
                                    });

                                    if (typeof kiemTraTrangThaiModal === 'function') {
                                        kiemTraTrangThaiModal(uniquePostId);
                                    }
                                }
                            }, 150);
                        };

                        postCard.addEventListener('click', (e) => {
                            e.preventDefault();
                            openDetailAction();
                        });

                        container.appendChild(postCard);
                    }
                }
            } catch (err) {
                console.error('Lỗi tải bài viết:', err);
            }
        }

        loadPosts();

        async function kiemTraTrangThaiModal(postId) {
            try {
                const res = await fetch(SCRIPT_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ action: "checkStatus", postId: postId })
                });
                const data = await res.json();
                
                const tag = document.getElementById("statusTag");
                const freeBox = document.getElementById("khoangFreeBox");
                const vipBox = document.getElementById("khoangVipBox");

                if (data.status === "success" && String(data.pageStatus).trim().toUpperCase() === "LOCK") {
                    if (tag) { tag.innerText = "🔴 BẢO TRÌ / ĐANG CẬP NHẬT"; tag.style.color = "#fb7185"; }
                    if (freeBox) freeBox.style.display = "none";
                    if (vipBox) vipBox.style.display = "none";
                } else {
                    if (tag) { tag.innerText = "🟢 WORKING (AUTO UPDATE)"; tag.style.color = "#34d399"; }
                    if (freeBox) freeBox.style.display = "block";
                    if (vipBox) vipBox.style.display = "block";
                }
            } catch (err) {
                console.error("Lỗi kiểm tra trạng thái:", err);
            }
        }

        function openModal(title, content) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalBody').innerHTML = content;
            document.getElementById('generalModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('generalModal').classList.add('hidden');
        }
    </script>
</body>
</html>
