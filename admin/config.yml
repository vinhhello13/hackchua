backend:
  name: github
  repo: vinhhello13/hackchua
  branch: main
  base_url: https://decap-cms-oauth.vercel.app
  auth_endpoint: /auth

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "posts"
    label: "Bài Viết / Script"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Tiêu đề Script", name: "title", widget: "string"}
      - {label: "Link Ảnh Thumbnail", name: "image", widget: "string"}
      - {label: "Link Rút Gọn Miễn Phí (Cuty.io)", name: "cuty_link", widget: "string", default: "https://cuty.io/hUDtD"}
      - {label: "Mã Lua Script (Loadstring khi mua VIP)", name: "lua_script", widget: "text"}
