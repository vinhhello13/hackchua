backend:
  name: github
  repo: vinhhello13/hackchua
  branch: main
  base_url: https://decap-cms-oauth.vercel.app
  auth_endpoint: /auth

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "posts"
    label: "Bài Viết / Script"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Tiêu đề Script", name: "title", widget: "string"}
      - {label: "Link Ảnh Thumbnail (Dán URL ảnh vào đây)", name: "image", widget: "string"}
      - {label: "Mô tả ngắn", name: "description", widget: "string"}
      - {label: "Nội dung chi tiết (Dán mã HTML & Script của bạn vào dưới <!--more-->)", name: "body", widget: "markdown"}
